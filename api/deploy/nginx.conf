map $http_upgrade $erect_connection {
  default upgrade;
  '' close;
}
server {
  listen 80;
  server_name erect3d.olanrewaju.xyz;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  server_name erect3d.olanrewaju.xyz;
  ssl_certificate /etc/letsencrypt/live/erect3d.olanrewaju.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erect3d.olanrewaju.xyz/privkey.pem;
  root /opt/erect3d/client/dist;
  index index.html;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $erect_connection;
    proxy_read_timeout 75s;
    # Share tokens and source URLs must not appear in access logs.
    access_log off;
  }
  location ~ ^/(health|ready)$ {
    proxy_pass http://127.0.0.1:4000;
    access_log off;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
