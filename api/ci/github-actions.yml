# Install this template as .github/workflows/api.yml when enabling GitHub CI.
name: Verify Erect3D
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erect_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erect_api_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U erect_test -d erect_api_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://erect_test:ci-only-password@127.0.0.1:5432/erect_api_test
      TEST_DATABASE_URL: postgres://erect_test:ci-only-password@127.0.0.1:5432/erect_api_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: api
      - run: bun install --frozen-lockfile
        working-directory: client
      - run: bun run migrate && bun run verify
        working-directory: api
      - run: bun test tests && bun run build
        working-directory: client
